# Настройки backup-storage (читается как shell-скрипт). Права: 640 root:root.

# Репозитории restic
RESTIC_LOCAL=/srv/backup/restic
# Внешняя копия (второй хост или S3). Пусто = не копировать.
# Пример: RESTIC_REMOTE=sftp:backup@host2:/srv/restic
RESTIC_REMOTE=
RESTIC_PASSWORD_FILE=/etc/restic/password

# База данных и что ещё бэкапить
# Имя базы PostgreSQL. Пусто = БД нет, дамп не делается.
PG_DB=
# Что бэкапить (через пробел). /etc нужен для тестового восстановления.
BACKUP_PATHS="/srv/apt /srv/git-mirror /etc"
# Если БД на другом хосте, раскомментируйте и настройте ~/.pgpass:
#export PGHOST=db.example.com
#export PGUSER=backup

# Политика хранения локального репозитория
KEEP_DAILY=7
KEEP_WEEKLY=4
KEEP_MONTHLY=6

# Каталоги
STATE_DIR=/var/lib/backup-storage
METRIC_DIR=/var/lib/node_exporter/textfile
