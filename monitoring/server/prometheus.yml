global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: node
    file_sd_configs:
      - files: ['/etc/prometheus/targets/node.yml']

  - job_name: openvpn
    file_sd_configs:
      - files: ['/etc/prometheus/targets/openvpn.yml']

  - job_name: blackbox-icmp
    metrics_path: /probe
    params: {module: [icmp]}
    file_sd_configs:
      - files: ['/etc/prometheus/targets/icmp.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox-openvpn
    metrics_path: /probe
    params: {module: [tcp_connect]}
    file_sd_configs:
      - files: ['/etc/prometheus/targets/openvpn-port.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
