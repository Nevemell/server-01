groups:
- name: infra
  rules:
  - alert: InstanceDown
    expr: up{job=~"node|openvpn"} == 0
    for: 2m
    labels: {severity: critical}
    annotations:
      summary: "{{ $labels.instance }}: exporter {{ $labels.job }} недоступен"
  - alert: HostUnreachablePing
    expr: probe_success{job="blackbox-icmp"} == 0
    for: 2m
    labels: {severity: critical}
    annotations:
      summary: "{{ $labels.instance }} не отвечает на ping"
  - alert: HighCpuUsage
    expr: 100 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 85
    for: 10m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: CPU {{ $value | printf \"%.0f\" }}%"
  - alert: HighLoad
    expr: node_load5 / count by(instance)(node_cpu_seconds_total{mode="idle"}) > 2
    for: 10m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: высокая нагрузка (load5/ядро > 2)"
  - alert: HighIowait
    expr: avg by(instance)(rate(node_cpu_seconds_total{mode="iowait"}[5m])) * 100 > 30
    for: 10m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: iowait {{ $value | printf \"%.0f\" }}%"
  - alert: CpuSteal
    expr: avg by(instance)(rate(node_cpu_seconds_total{mode="steal"}[5m])) * 100 > 10
    for: 10m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: steal {{ $value | printf \"%.0f\" }}%"
  - alert: LowMemory
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
    for: 5m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: доступно памяти {{ $value | printf \"%.0f\" }}%"
  - alert: SwapUsedHigh
    expr: (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) * 100 > 50 and node_memory_SwapTotal_bytes > 0
    for: 10m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: swap занят на {{ $value | printf \"%.0f\" }}%"
  - alert: OomKillDetected
    expr: increase(node_vmstat_oom_kill[5m]) > 0
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: сработал OOM-killer"
  - alert: DiskSpaceLow
    expr: node_filesystem_avail_bytes{fstype=~"ext.|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext.|xfs|btrfs"} * 100 < 15
    for: 10m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} свободно {{ $value | printf \"%.0f\" }}%"
  - alert: DiskSpaceCritical
    expr: node_filesystem_avail_bytes{fstype=~"ext.|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext.|xfs|btrfs"} * 100 < 5
    for: 5m
    labels: {severity: critical}
    annotations:
      summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} свободно {{ $value | printf \"%.0f\" }}%"
  - alert: DiskWillFillIn24h
    expr: predict_linear(node_filesystem_avail_bytes{fstype=~"ext.|xfs|btrfs"}[6h], 24*3600) < 0
    for: 30m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} заполнится в течение суток"
  - alert: InodesLow
    expr: node_filesystem_files_free{fstype=~"ext.|xfs"} / node_filesystem_files{fstype=~"ext.|xfs"} * 100 < 10
    for: 10m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} мало inode"
  - alert: FilesystemReadOnly
    expr: node_filesystem_readonly{fstype=~"ext.|xfs|btrfs"} == 1
    for: 1m
    labels: {severity: critical}
    annotations:
      summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} в режиме read-only"
  - alert: DiskIoSaturated
    expr: rate(node_disk_io_time_seconds_total[5m]) > 0.9
    for: 10m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: диск {{ $labels.device }} загружен >90%"
  - alert: NetworkErrors
    expr: rate(node_network_receive_errs_total{device!~"lo|veth.*"}[5m]) + rate(node_network_transmit_errs_total{device!~"lo|veth.*"}[5m]) + rate(node_network_receive_drop_total{device!~"lo|veth.*"}[5m]) + rate(node_network_transmit_drop_total{device!~"lo|veth.*"}[5m]) > 1
    for: 10m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: ошибки/потери на {{ $labels.device }}"
  - alert: ConntrackNearLimit
    expr: node_nf_conntrack_entries / node_nf_conntrack_entries_limit * 100 > 80
    for: 5m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: conntrack заполнен на {{ $value | printf \"%.0f\" }}%"
  - alert: FileDescriptorsHigh
    expr: node_filefd_allocated / node_filefd_maximum * 100 > 80
    for: 5m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: файловых дескрипторов использовано {{ $value | printf \"%.0f\" }}%"
  - alert: ClockSkew
    expr: abs(node_timex_offset_seconds) > 0.05
    for: 10m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: рассинхронизация времени {{ $value }} c"
  - alert: UnexpectedReboot
    expr: changes(node_boot_time_seconds[10m]) > 0
    labels: {severity: info}
    annotations:
      summary: "{{ $labels.instance }} был перезагружен"
  - alert: RebootRequired
    expr: node_reboot_required == 1
    for: 7d
    labels: {severity: info}
    annotations:
      summary: "{{ $labels.instance }}: требуется перезагрузка (обновления)"
  - alert: SystemdUnitFailed
    expr: node_systemd_unit_state{state="failed"} == 1
    for: 5m
    labels: {severity: warning}
    annotations:
      summary: "{{ $labels.instance }}: юнит {{ $labels.name }} в состоянии failed"
